# 学習用の架空設計。検証は未実施で、すべて result: unknown。
# フィールド・参照の見どころは Examples ページと docs/EXAMPLES.md を参照。
version: '0.1'
product:
  id: customer-platform
  name: 顧客プラットフォーム
  purpose: 顧客が安全にサービスを利用できる
  primary_users:
    - 顧客
    - サポート担当
  user_value: 安心して自分の情報にアクセスできる
  scope:
    - 認証
    - 顧客情報
  owner: platform-team
  capabilities:
    - id: authentication
      name: 安全にログインできる
      purpose: 顧客の本人性を確認する
      actor:
        - 顧客
      inputs:
        - 認証情報
      outputs:
        - アクセストークン
      quality:
        availability:
          id: auth-availability
          name: 認証可用性
          requirement: 月間の認証成功率を保証する
          target: 99.99
          unit: '%'
          risk: high
          realized_by:
            - auth-service
            - audit-service
          verified_by:
            - failover-test
          attribute: availability
          owner: customer-platform-team
          status: designed
          description: 認証可用性の責務・条件を定義する設計サンプル。
          extensions:
            measurement_window: calendar-month
            excludes:
              - invalid_credentials
      behaviors:
        - id: login
          name: ログインする
          trigger: 顧客が認証情報を送信する
          outcomes:
            - アクセストークン発行
            - UserAuthenticatedイベント発行
          failure_behaviors:
            - 不正な認証情報を拒否
          realized_by:
            - auth-service
            - audit-service
          scenarios:
            - id: login-success
              name: 正しい認証情報でログインできる
              verified_by:
                - login-contract
              type: gherkin
              specification: |
                Given 有効なユーザーが存在する
                When 正しい認証情報でログインする
                Then アクセストークンが返る
                And UserAuthenticatedが発行される
              owner: customer-platform-team
              status: designed
              description: 正しい認証情報でログインできるの責務・条件を定義する設計サンプル。
              extensions:
                test_case: AUTH-001
                test_data: synthetic customer
          actor:
            - 顧客
          preconditions:
            - 顧客IDが発行済みである
          side_effects:
            - 操作履歴を非同期に保存する
          commands:
            - AuthenticateCustomer
          events:
            - CustomerAuthenticated
          use_cases:
            - 会員サービスへのアクセス開始
          uses:
            - customer-login-api
            - customer-login-event
            - customer-directory
          owner: customer-platform-team
          status: designed
          description: ログインするの責務・条件を定義する設計サンプル。
          extensions:
            idempotency_key: request_id
        - id: logout
          name: ログアウトする
          trigger: 顧客がログアウトを要求する
          outcomes:
            - セッション無効化
          realized_by:
            - auth-service
          scenarios:
            - id: logout-success
              name: セッションが失効する
              verified_by:
                - logout-unit
              type: gherkin
              specification: |
                Given ログイン済みの顧客がいる
                When ログアウトする
                Then セッションが無効になる
              owner: customer-platform-team
              status: designed
              description: セッションが失効するの責務・条件を定義する設計サンプル。
          actor:
            - 顧客
          preconditions:
            - 顧客IDが発行済みである
          side_effects:
            - 操作履歴を非同期に保存する
          failure_behaviors:
            - 監査キューへの保存が失敗した場合は再試行する
          commands:
            - RevokeSession
          events:
            - SessionRevoked
          use_cases:
            - 共有端末の利用終了
          uses:
            - session-revoke-message
          owner: customer-platform-team
          status: designed
          description: ログアウトするの責務・条件を定義する設計サンプル。
      guarantees:
        - 失効したセッションから個人情報へアクセスさせない
      constraints:
        - 生のパスワードとトークンを永続化しない
      qualities:
        - auth-reliability
        - auth-resilience
        - auth-recoverability
        - auth-scalability
        - auth-operability
        - auth-maintainability
        - auth-compatibility
        - auth-interoperability
        - auth-portability
        - auth-migration
        - auth-deployment
      owner: customer-platform-team
      status: designed
      description: 安全にログインできるの責務・条件を定義する設計サンプル。
      extensions:
        journey: member-sign-in
  description: 顧客IDを基点にした会員サービスの認証・監査基盤。契約・データ・コード配置・監視までを追跡する。
  out_of_scope:
    - 請求決済
    - 顧客向け通知画面
  extensions:
    example_focus: 全フィールドの記述と契約・証跡の対応
  status: designed
components:
  - id: auth-service
    name: 認証サービス
    kind: application
    responsibilities:
      - 認証情報検証
      - トークン発行
      - セッション失効
    template: hexagonal
    implemented_by:
      - auth-runtime
      - auth-source
      - auth-iac
    provides:
      - customer-login-api
      - customer-login-event
    consumes:
      - customer-directory
      - session-revoke-message
    interfaces:
      - HTTPS / JSON
      - Pub/Sub command subscription
    data:
      - 顧客ID
      - ハッシュ化されたセッション識別子
      - セッション有効期限
    owner: customer-platform-team
    status: designed
    description: 認証サービスの責務・条件を定義する設計サンプル。
    extensions:
      bounded_context: identity
  - id: audit-service
    name: 監査サービス
    kind: platform
    responsibilities:
      - 認証履歴記録
      - 認証失敗監視
    implemented_by:
      - audit-storage
    consumes:
      - customer-login-event
    interfaces:
      - 非同期イベント購読
    data:
      - 匿名化された操作イベント
    owner: customer-platform-team
    status: designed
    description: 監査サービスの責務・条件を定義する設計サンプル。
  - id: session-domain
    name: セッション業務ルール
    kind: domain
    responsibilities:
      - 有効期限と失効の整合性を判定する
    interfaces:
      - SessionPolicy.check
    data:
      - 失効時刻
      - 有効期限
    template: ddd
    realizes:
      - logout
    implemented_by:
      - session-module
    owner: customer-platform-team
    status: designed
    description: セッション業務ルールの責務・条件を定義する設計サンプル。
  - id: customer-adapter
    name: 顧客ディレクトリアダプタ
    kind: interface
    responsibilities:
      - 外部ディレクトリの応答を内部の顧客識別子へ変換する
    interfaces:
      - DirectoryPort
    data:
      - 外部IDと顧客IDの対応
    template: vertical-slice
    realizes:
      - auth-availability
    implemented_by:
      - adapter-directory
    consumes:
      - customer-directory
    owner: customer-platform-team
    status: designed
    description: 顧客ディレクトリアダプタの責務・条件を定義する設計サンプル。
  - id: session-store
    name: セッションデータ管理
    kind: data
    responsibilities:
      - 失効セッションの検索とTTL削除
    interfaces:
      - Key-value lookup
    data:
      - セッションハッシュ
      - TTL
    realizes:
      - logout
    implemented_by:
      - session-cache
    owner: customer-platform-team
    status: designed
    description: セッションデータ管理の責務・条件を定義する設計サンプル。
realizations:
  - id: auth-runtime
    name: 認証API / Cloud Run
    kind: runtime
    provider: gcp
    service: Cloud Run
    environment: production
    public: true
    authentication: OIDC / Identity Platform
    observability:
      - 認証成功率メトリクス
      - エラー率アラート
    location: asia-northeast1
    deployment_strategy: ステージングの契約検証後に段階的に切り替える
    owner: platform-team
    status: designed
    description: 認証API / Cloud Runの責務・条件を定義する設計サンプル。
    extensions:
      example_project: example-staging
      region_role: primary
  - id: auth-source
    name: 認証ソースコード
    kind: source
    location: src/components/auth/
    owner: platform-team
    status: designed
    description: 認証ソースコードの責務・条件を定義する設計サンプル。
  - id: auth-iac
    name: 認証インフラ定義
    kind: iac
    location: infra/auth/main.tf
    owner: platform-team
    status: designed
    description: 認証インフラ定義の責務・条件を定義する設計サンプル。
  - id: audit-storage
    name: 監査ログ / BigQuery
    kind: data
    provider: gcp
    service: BigQuery
    owner: platform-team
    status: designed
    description: 監査ログ / BigQueryの責務・条件を定義する設計サンプル。
  - id: session-module
    name: Session Policy Module
    kind: module
    location: src/session/domain/session-policy.ts
    owner: platform-team
    status: designed
    description: Session Policy Moduleの責務・条件を定義する設計サンプル。
  - id: adapter-directory
    name: Directory Adapter Package
    kind: directory
    location: src/adapters/customer-directory/
    owner: platform-team
    status: designed
    description: Directory Adapter Packageの責務・条件を定義する設計サンプル。
  - id: session-cache
    name: Session Cache
    kind: resource
    provider: gcp
    service: Memorystore
    location: asia-northeast1
    public: false
    authentication: 専用サービスアカウントと閉域接続
    owner: platform-team
    status: designed
    description: Session Cacheの責務・条件を定義する設計サンプル。
verifications:
  - id: login-contract
    name: 認証API契約テスト
    level: contract
    method: 成功応答とイベント形式を確認
    location: test/auth-contract.test.ts
    result: unknown
    owner: quality-engineering
    status: designed
    description: 認証API契約テストの責務・条件を定義する設計サンプル。
    evidenced_by:
      - login-contract-report
    extensions:
      runner: planned CI job
      execution_status: not_run
  - id: logout-unit
    name: セッション失効テスト
    level: unit
    method: ログアウト後のトークン無効化を確認
    result: unknown
    owner: quality-engineering
    status: designed
    description: セッション失効テストの責務・条件を定義する設計サンプル。
    location: test/planned/logout-unit.test.ts
    evidenced_by:
      - logout-unit-report
  - id: failover-test
    name: 障害復旧テスト
    level: resilience
    method: 障害注入時の成功率と復旧時間を測定
    result: unknown
    owner: quality-engineering
    status: designed
    description: 障害復旧テストの責務・条件を定義する設計サンプル。
    location: test/planned/failover-test.test.ts
    evidenced_by:
      - failover-test-report
  - id: audit-test
    name: 監査ログ検証
    level: telemetry
    method: 認証イベントの監査ログ保存を確認
    result: unknown
    owner: quality-engineering
    status: designed
    description: 監査ログ検証の責務・条件を定義する設計サンプル。
    location: test/planned/audit-test.test.ts
    evidenced_by:
      - audit-test-report
  - id: capacity-test
    name: 認証ピーク負荷試験
    level: integration
    method: stagingに500req/sを5分間送信し、成功率とp95遅延を記録する
    result: unknown
    owner: quality-engineering
    status: designed
    description: 認証ピーク負荷試験の責務・条件を定義する設計サンプル。
    location: test/planned/capacity-test.test.ts
    evidenced_by:
      - capacity-test-report
  - id: operations-test
    name: 認証障害の運用確認
    level: acceptance
    method: 相関IDからログ・トレース・復旧手順を辿れることを演習する
    result: unknown
    owner: quality-engineering
    status: designed
    description: 認証障害の運用確認の責務・条件を定義する設計サンプル。
    location: test/planned/operations-test.test.ts
    evidenced_by:
      - operations-test-report
  - id: architecture-test
    name: 依存境界の静的検査
    level: unit
    method: domainからprovider SDKへのimportがないことを検査する
    result: unknown
    owner: quality-engineering
    status: designed
    description: 依存境界の静的検査の責務・条件を定義する設計サンプル。
    location: test/planned/architecture-test.test.ts
    evidenced_by:
      - architecture-test-report
  - id: migration-test
    name: セッション形式移行確認
    level: integration
    method: 旧形式・新形式・混在データで失効判定とTTLを照合する
    result: unknown
    owner: quality-engineering
    status: designed
    description: セッション形式移行確認の責務・条件を定義する設計サンプル。
    location: test/planned/migration-test.test.ts
    evidenced_by:
      - migration-test-report
  - id: deployment-test
    name: リリース後の主要導線
    level: e2e
    method: 段階配備後にテスト顧客でログインとログアウトを行い、ロールバック後も同じ導線を確認する
    result: unknown
    owner: quality-engineering
    status: designed
    description: リリース後の主要導線の責務・条件を定義する設計サンプル。
    location: test/planned/deployment-test.test.ts
    evidenced_by:
      - deployment-test-report
policies:
  - id: auth-baseline
    name: 認証監査ポリシー
    applies_to:
      - authentication
      - auth-service
      - auth-runtime
    realized_by:
      - audit-service
    verified_by:
      - audit-test
    rules:
      - 認証の成功と失敗を監査ログに残す
    category: logging_standard
    owner: customer-platform-team
    status: designed
    description: 認証監査ポリシーの責務・条件を定義する設計サンプル。
    extensions:
      review_cycle: quarterly
decisions:
  - id: serverless-auth
    name: サーバーレス認証API
    title: Cloud Runを採用する
    category: runtime
    context: 運用負荷を抑えたい
    decision: 認証APIをCloud Runで実行する
    alternatives:
      - GKE
      - Compute Engine
    reason: 小規模チームで運用できる
    trade_off:
      - 起動レイテンシーの監視が必要
    decision_status: accepted
    affects:
      - authentication
      - auth-runtime
    owner: customer-platform-team
    status: designed
    description: サーバーレス認証APIの責務・条件を定義する設計サンプル。
    extensions:
      record: ADR-001
      example: true
contracts:
  - id: customer-login-api
    name: POST /sessions
    kind: http
    specification: contracts/customer-login.openapi.yaml
    verified_by:
      - login-contract
    owner: customer-platform-team
    status: designed
    description: POST /sessionsの責務・条件を定義する設計サンプル。
    extensions:
      version: 1.0.0
      compatibility: backward-compatible
  - id: customer-login-event
    name: CustomerAuthenticated v1
    kind: event
    specification: contracts/customer-events.asyncapi.yaml
    verified_by:
      - audit-test
    owner: customer-platform-team
    status: designed
    description: CustomerAuthenticated v1の責務・条件を定義する設計サンプル。
  - id: customer-directory
    name: 顧客ディレクトリ境界
    kind: external
    specification: contracts/customer-directory.md
    verified_by:
      - login-contract
    owner: customer-platform-team
    status: designed
    description: 顧客ディレクトリ境界の責務・条件を定義する設計サンプル。
  - id: session-revoke-message
    name: RevokeSession
    kind: message
    specification: contracts/revoke-session.schema.json
    verified_by:
      - logout-unit
    owner: customer-platform-team
    status: designed
    description: RevokeSessionの責務・条件を定義する設計サンプル。
qualities:
  - id: auth-reliability
    name: ログアウト要求は重複送信でも一度の状態遷移として扱う
